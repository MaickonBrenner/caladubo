name: caladubo
description: "Aplicativo para recomendação e nutrição de solo."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  dropdown_button2: ^2.3.9
  floating_bottom_navigation_bar: ^1.5.2
  responsive_grid_list: ^1.4.0
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  sqflite: ^2.3.3+1         
  path: ^1.9.0
  sqflite_common_ffi: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icone.png"
  min_sdk_android: 21
  remove_alpha_channel: true
  adaptive_icon_background: "#FBECD901"
  adaptive_icon_foreground: "assets/images/icone.png"

flutter:
  uses-material-design: true

  assets: 
    - assets/images/
    - assets/cards/
    - assets/json/